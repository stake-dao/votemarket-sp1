name: Docker publish

# Publishes the reproducible SP1 toolchain image (docker/Dockerfile) to GHCR so
# downstream consumers (stake-dao/automation-guard `vm-sp1-prove`) can pull a
# pinned digest instead of rebuilding the toolchain every run. The image is
# toolchain-only: sources are bind-mounted at /workspace at run time (see
# docker/docker-compose.yml), so consumers still check out this repo at the ref
# they want to prove with.

on:
  push:
    branches: [main]
    # The image content only depends on these paths; other pushes would rebuild
    # a byte-identical image under a new tag for nothing.
    paths:
      - "docker/**"
      - ".dockerignore"
      - "toolkit-requirements.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/docker-publish.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build and push image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          # The compose file forces linux/amd64 for reproducible VKEY generation;
          # the published image keeps the same constraint.
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Digest to summary
        env:
          IMAGE_REF: ghcr.io/${{ github.repository }}@${{ steps.push.outputs.digest }}
        run: |
          {
            echo "### Image published"
            echo "\`${IMAGE_REF}\`"
            echo ""
            echo "Pin this digest in stake-dao/automation-guard vm-sp1-prove.yaml."
          } >> "$GITHUB_STEP_SUMMARY"
